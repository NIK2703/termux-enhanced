[package]
name = "termux_terminal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "termux_terminal"
crate-type = ["cdylib", "rlib"]

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }
jni = "0.21.1"
base64 = "0.22"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
