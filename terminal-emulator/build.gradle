apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace "com.termux.emulator"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            def splitForRelease = (System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "1").toBoolean()
            if (!splitForRelease) {
                def termuxAbis = (System.getenv("TERMUX_ARCH") ?: project.properties.termuxBuildAbis ?: "arm64-v8a").split(',').collect { it.trim() }
                abiFilters(*termuxAbis)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    // Rust terminal core. Cargo cannot run build scripts from /storage (noexec), so its
    // target directory defaults to an executable cache under the user's home; only the
    // finished .so files are copied into the Gradle build directory.
    def rustAbis = (System.getenv("TERMUX_ARCH") ?: project.properties.termuxBuildAbis ?: "arm64-v8a")
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
    def rustCargoTargetDir = System.getenv("TERMUX_CARGO_TARGET_DIR")
        ?: "${System.getProperty('user.home')}/.cache/termux-terminal-target"
    def rustJniLibsDir = file("$buildDir/generated/rustJniLibs")
    sourceSets.main.jniLibs.srcDir rustJniLibsDir
    def rustTargets = [
        'arm64-v8a'  : ['aarch64-linux-android', 'aarch64-linux-android', 'aarch64_linux_android'],
        'armeabi-v7a': ['armv7-linux-androideabi', 'armv7a-linux-androideabi', 'armv7_linux_androideabi'],
        'x86_64'     : ['x86_64-linux-android', 'x86_64-linux-android', 'x86_64_linux_android'],
        'x86'        : ['i686-linux-android', 'i686-linux-android', 'i686_linux_android'],
    ]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
            }
        }
    }

    // aarch64 Linux fix: AGP's stripReleaseDebugSymbols now uses the native
    // linux-aarch64 llvm-strip via a symlink at
    //   $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
    // (pointed at toolchains/llvm/prebuilt/linux-aarch64/bin/llvm-strip).
    // That fix was applied 2026-07-29; no Gradle workaround needed here.
}

apply plugin: 'checkstyle'

checkstyle {
    toolVersion = '10.21.4'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

tasks.register('checkstyle', Checkstyle) {
    group = 'verification'
    description = 'Run Checkstyle on Java sources'
    source android.sourceSets.main.java.srcDirs
    include '**/*.java'
    classpath = files()
    showViolations = true
}


// Build libtermux_terminal.so for each configured ABI and expose it as a jniLibs source.
def rustCargoTargetDir = System.getenv("TERMUX_CARGO_TARGET_DIR")
    ?: "${System.getProperty('user.home')}/.cache/termux-terminal-target"
def rustJniLibsDir = file("$buildDir/generated/rustJniLibs")
def rustDir = file('src/main/rust')
def rustAbis = (System.getenv("TERMUX_ARCH") ?: project.properties.termuxBuildAbis ?: "arm64-v8a")
    .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def rustTargets = [
    'arm64-v8a'  : ['aarch64-linux-android', 'aarch64-linux-android', 'aarch64_linux_android'],
    'armeabi-v7a': ['armv7-linux-androideabi', 'armv7a-linux-androideabi', 'armv7_linux_androideabi'],
    'x86_64'     : ['x86_64-linux-android', 'x86_64-linux-android', 'x86_64_linux_android'],
    'x86'        : ['i686-linux-android', 'i686-linux-android', 'i686_linux_android'],
]

def execOperations = services.get(org.gradle.process.ExecOperations)

def cargoBuildRust = tasks.register('cargoBuildRust') {
    group = 'build'
    description = 'Build the Rust terminal core for the configured Android ABIs'
    inputs.file(file('src/main/rust/Cargo.toml'))
    inputs.file(file('src/main/rust/Cargo.lock'))
    inputs.dir(file('src/main/rust/src'))
    inputs.dir(file('src/main/rust/vendor'))
    outputs.dir(rustJniLibsDir)

    doLast {
        def ndkRoot = System.getenv('ANDROID_NDK_HOME')
        if (!ndkRoot) {
            def props = new Properties()
            def localProps = rootProject.file('local.properties')
            if (localProps.exists()) localProps.withInputStream { props.load(it) }
            ndkRoot = props.getProperty('ndk.dir') ?: "${props.getProperty('sdk.dir')}/ndk/${project.properties.ndkVersion}"
        }
        def prebuilt = null
        for (arch in ['linux-aarch64', 'linux-x86_64', 'windows-x86_64', 'darwin-x86_64', 'darwin-aarch64']) {
            def dir = file("${ndkRoot}/toolchains/llvm/prebuilt/${arch}/bin")
            if (new File(dir, 'llvm-ar').exists() || new File(dir, 'llvm-ar.exe').exists()) {
                prebuilt = dir
                break
            }
        }
        if (prebuilt == null) throw new GradleException("NDK LLVM toolchain not found under ${ndkRoot}")

        rustAbis.each { abi ->
            def target = rustTargets[abi]
            if (target == null) throw new GradleException("Unsupported ABI for the Rust terminal core: ${abi}")
            def targetTriple = target[0]
            def clangPrefix = target[1]
            def cargoEnvSuffix = target[2]
            def clang = new File(prebuilt, "${clangPrefix}21-clang")
            if (!clang.exists()) throw new GradleException("Clang wrapper not found: ${clang}")

            execOperations.exec {
                workingDir rustDir
                environment 'CARGO_TARGET_DIR', rustCargoTargetDir
                environment "CC_${cargoEnvSuffix}", clang.absolutePath
                environment "AR_${cargoEnvSuffix}", new File(prebuilt, 'llvm-ar').absolutePath
                environment "CARGO_TARGET_${cargoEnvSuffix.toUpperCase()}_LINKER", clang.absolutePath
                commandLine 'cargo', 'build', '--release', '--target', targetTriple
            }

            def produced = file("${rustCargoTargetDir}/${targetTriple}/release/libtermux_terminal.so")
            if (!produced.exists()) throw new GradleException("Cargo did not produce ${produced}")
            copy {
                from produced
                into file("${rustJniLibsDir}/${abi}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn cargoBuildRust }
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
        task.dependsOn cargoBuildRust
    }
}
